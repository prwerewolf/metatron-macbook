name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B scripts/privacy_check.py
      - name: Check publishable history
        # PR checkout includes GitHub's temporary test merge. Scan its combined
        # files above, and enforce commit identities on the actual outgoing head.
        env:
          PUBLIC_HISTORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/privacy_check.py --history --ref "$PUBLIC_HISTORY_REF"
      - run: python3 -B -m unittest discover -s tests -p 'test_privacy.py'

  regression:
    name: macOS regression tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make test
      - run: swift build -c release

name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B scripts/privacy_check.py
      - run: python3 -B scripts/privacy_check.py --history --ref HEAD
      - run: python3 -B -m unittest discover -s tests -p 'test_privacy.py'

  regression:
    name: macOS regression tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make test
      - run: swift build -c release
